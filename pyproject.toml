[project]
name = "soundsanity"
version = "0.1.0"
description = "A Python library to perform sanity checks and quality diagnostics on Antarctic soundscape field recordings using Essentia."
readme = "README.md"
requires-python = ">=3.9,<3.14"
authors = [{ name = "Antarctic Soundscape Research Group" }]
dependencies = [
    "essentia>=2.1b6.dev1389",
    "matplotlib>=3.5",
    "numpy>=1.21",
    "pandas>=2.0",
    "pyarrow>=14",
]

[dependency-groups]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "pytest>=8.4.2",
    "pandas>=2.3.3",
    "openpyxl>=3.1.5",
    "scipy>=1.13.1",
]

[project.scripts]
soundsanity-report = "soundsanity.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soundsanity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
