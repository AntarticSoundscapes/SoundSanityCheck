[project]
name = "soundsanity"
version = "0.1.0"
description = "A Python library to perform sanity checks and quality diagnostics on Antarctic soundscape field recordings using Essentia."
readme = "README.md"
requires-python = ">=3.9,<3.14"
authors = [{ name = "Antarctic Soundscape Research Group" }]
dependencies = [
    "essentia>=2.1b6.dev1389",
    "matplotlib>=3.5",
    "numpy>=1.21",
]

[dependency-groups]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soundsanity"]
